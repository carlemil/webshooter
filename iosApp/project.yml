name: iosApp
options:
  bundleIdPrefix: se.kjellstrand
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true

# Swift Package Manager dependencies. firebase-ios-sdk supplies both
# FirebaseAnalytics and FirebaseCrashlytics; we only depend on
# Crashlytics today. Pinned to a major version to avoid surprise
# breaking changes between Firebase BoM updates.
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0

# Mirrors the Android side's `prod` and `staging` product flavors:
# each scheme maps to one build configuration that hard-codes the
# backend URL. The CLIENT_SECRET is the same fallback the Android
# build uses (see app/build.gradle.kts productFlavors).
configs:
  Debug-Staging: debug
  Debug-Prod: debug
  Release-Staging: release
  Release-Prod: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Ad-hoc signing for Simulator. Real signing identity comes in Phase 8
    # when we move to device installs. Ad-hoc is needed so the entitlements
    # file is embedded — the Keychain APIs (used by AuthTokenManager
    # and SecurePrefs) require keychain-access-groups even on Simulator.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    WEBSHOOTER_CLIENT_SECRET: "REMOVED-CLIENT-SECRET"
    # Crash reporting only ships on Release-Prod. Staging + every debug
    # config stays Napier-only — see IosCrashReporter bind in
    # IosPlatformModule. Read at runtime from Info.plist by WebshooterApp.
    WEBSHOOTER_CRASH_REPORTING_ENABLED: "NO"
  configs:
    Debug-Staging:
      WEBSHOOTER_BASE_URL: "https://staging.webshooter.se/"
    Release-Staging:
      WEBSHOOTER_BASE_URL: "https://staging.webshooter.se/"
    Debug-Prod:
      WEBSHOOTER_BASE_URL: "https://webshooter.se/"
    Release-Prod:
      WEBSHOOTER_BASE_URL: "https://webshooter.se/"
      WEBSHOOTER_CRASH_REPORTING_ENABLED: "YES"

targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosApp
        excludes:
          - "Resources/mocks"
      - path: iosApp/Resources/mocks
        # Folder reference (blue) so the bundle preserves the `mocks/`
        # subdirectory — `NSBundle.pathForResource:ofType:inDirectory:`
        # in IosMockInterceptor needs it.
        type: folder
    dependencies:
      - package: Firebase
        product: FirebaseCrashlytics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.kjellstrand.webshooter
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
        INFOPLIST_FILE: iosApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
    preBuildScripts:
      - name: "Embed Kotlin/Native shared framework"
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          cd "$SRCROOT/.."
          # Pick a JDK 17–22 (Gradle 8.9 doesn't run under JDK 26). Prefer
          # JAVA_HOME from the Xcode env if it points at a usable JDK, else
          # auto-pick the highest installed openjdk@N (21 preferred). If
          # nothing matches, fall back to the system /usr/bin/java's home.
          if [ -z "${JAVA_HOME:-}" ] || ! "$JAVA_HOME/bin/javac" -version 2>&1 | grep -qE "javac (1[7-9]|2[0-2])"; then
            for v in 21 20 19 18 17; do
              if [ -d "/opt/homebrew/opt/openjdk@${v}/libexec/openjdk.jdk/Contents/Home" ]; then
                export JAVA_HOME="/opt/homebrew/opt/openjdk@${v}/libexec/openjdk.jdk/Contents/Home"
                break
              fi
            done
            if [ -z "${JAVA_HOME:-}" ]; then
              export JAVA_HOME="$(/usr/libexec/java_home 2>/dev/null || true)"
            fi
          fi
          # KOTLIN_FRAMEWORK_BUILD_TYPE picks debug-vs-release from our
          # config name (the plugin's auto-detect only handles plain
          # Debug/Release, not the Staging/Prod-suffixed variants).
          if [[ "$CONFIGURATION" == Debug* ]]; then
            export KOTLIN_FRAMEWORK_BUILD_TYPE=debug
          else
            export KOTLIN_FRAMEWORK_BUILD_TYPE=release
          fi
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode \
            -Pkotlin.native.cocoapods.generate.wrapper=false

  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosAppUITests
    dependencies:
      - target: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.kjellstrand.webshooter.uitests
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: iosApp
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES

  iosAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosAppTests
    dependencies:
      - target: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.kjellstrand.webshooter.tests
        SWIFT_VERSION: "5.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/iosApp.app/iosApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared

schemes:
  Staging:
    build:
      targets:
        iosApp: all
        iosAppUITests: [test]
        iosAppTests: [test]
    run:
      config: Debug-Staging
    test:
      config: Debug-Staging
      targets:
        - iosAppTests
        - iosAppUITests
    profile:
      config: Release-Staging
    analyze:
      config: Debug-Staging
    archive:
      config: Release-Staging
  Prod:
    build:
      targets:
        iosApp: all
        iosAppUITests: [test]
        iosAppTests: [test]
    run:
      config: Debug-Prod
    test:
      config: Debug-Prod
      targets:
        - iosAppTests
        - iosAppUITests
    profile:
      config: Release-Prod
    analyze:
      config: Debug-Prod
    archive:
      config: Release-Prod
